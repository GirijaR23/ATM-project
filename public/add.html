<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add User Account</title>
    <link rel="stylesheet" href="/css/admin.css">
</head>
<body>
    <div class="page">
        <div class="header">
            <h1>Add User Account</h1>
            <div class="nav-links">
                <a href="/" class="nav-link secondary">Home</a>
                <a href="/read" class="nav-link secondary">Read Data</a>
            </div>
        </div>

        <div class="card form-card">
            <form action="/submit" method="post" class="form-grid">

                <label for="accnum">Account / Card Number</label>
                <input type="number" id="accnum" name="accnum" placeholder="1234 1234 1234 1234" required>

                <label for="pinnum">PIN Number</label>
                <input type="password" id="pinnum" name="pinnum" placeholder="1234" required>

                <label for="accbls">Account Balance</label>
                <input type="number" id="accbls" name="accbls" placeholder="₹000000" required>

                <div class="actions">
                    <button type="submit" class="button primary">Submit</button>
                    <a href="/read" class="button secondary">Read Data</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
